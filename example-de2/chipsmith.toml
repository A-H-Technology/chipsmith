[project]
name = "blinky"
top = "blinky"

[toolchain]
quartus-ii-13 = "13.0sp1"

[target]
family = "Cyclone II"
device = "EP2C35F672C6"
io_standard = "3.3-V LVTTL"

[hdl]
standard = "VHDL_2008"
sources = ["src/*.vhd"]

[pins]
CLOCK_50 = "PIN_N2"
LEDR = ["PIN_R17", "PIN_R18", "PIN_U18", "PIN_Y18"]

[clocks]
CLOCK_50 = "50 MHz"

[sim]
# GHDL needs no toolchain and no licence. Set this to "quartus" to use the
# simulator your Quartus bundles instead (Questa wants a licence; see README).
simulator = "ghdl"
sources = ["tb/*.vhd"]
testbenches = ["blinky_tb"]
