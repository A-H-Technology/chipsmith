# The DE2's 8 MB SDRAM (ISSI IS42S16400, 4 banks x 4096 rows x 256 x 16
# bits) written and read back over and over, the result over JTAG.
[project]
name = "sdram-selftest"
top = "top"
sources = ["src/*.v"]

[target]
device = "EP2C35F672C6"

# Pins: Terasic's DE2_pin_assignments.csv (DE2 System CD; a copy at
# https://people.ece.cornell.edu/land/courses/ece5760/NiosII_asm/DE2_pin_assignments.csv),
# the DE2 user manual's SDRAM table. DRAM_CLK (PIN_AA7) is PLL_1's clock
# output pin. Every SDRAM pin but the constant ones goes through its I/O-cell registers, so the
# board timing doesn't depend on placement.
[pins]
CLOCK_50 = "PIN_N2"
DRAM_ADDR = { pins = ["PIN_T6", "PIN_V4", "PIN_V3", "PIN_W2", "PIN_W1", "PIN_U6", "PIN_U7", "PIN_U5", "PIN_W4", "PIN_W3", "PIN_Y1", "PIN_V5"], registers = ["output"] }
DRAM_BA = { pins = ["PIN_AE2", "PIN_AE3"], registers = ["output"] }
DRAM_DQM = ["PIN_AD2", "PIN_Y5"]
DRAM_CS_N = "PIN_AC3"
DRAM_RAS_N = { pin = "PIN_AB4", registers = ["output"] }
DRAM_CAS_N = { pin = "PIN_AB3", registers = ["output"] }
DRAM_WE_N = { pin = "PIN_AD3", registers = ["output"] }
DRAM_CKE = "PIN_AA6"
DRAM_CLK = "PIN_AA7"
DRAM_DQ = { pins = ["PIN_V6", "PIN_AA2", "PIN_AA1", "PIN_Y3", "PIN_Y4", "PIN_R8", "PIN_T8", "PIN_V7", "PIN_W6", "PIN_AB2", "PIN_AB1", "PIN_AA4", "PIN_AA3", "PIN_AC2", "PIN_AC1", "PIN_AA5"], registers = ["input", "output", "output-enable"] }
LEDR = ["PIN_AE23", "PIN_AF23", "PIN_AB21", "PIN_AC22"]
LEDG = "PIN_AE22"

[clocks]
CLOCK_50 = "50 MHz"
