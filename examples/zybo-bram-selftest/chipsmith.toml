# A block RAM self-test read back over JTAG: memories in most RAMB18E1
# modes written and read back over and over, the passes and the errors in
# USER1. examples/m4k-selftest on the Zybo.
[project]
name = "bram-selftest"
top = "top"
sources = ["src/*.v"]

[target]
device = "xc7z010clg400-1"

# Original Zybo (now "Zybo (legacy)"), Digilent Zybo-Master.xdc.
[pins]
clk = "L16"
led = ["M14", "M15", "G14", "D18"]

# The Zybo's 125 MHz clock on L16.
[clocks]
clk = "125 MHz"
