[project]
name = "irq"
top = "irq"
sources = ["src/*.v"]

[target]
device = "A5EB013BB23BE4SCS"
# The DE25-Nano boots HPS-first: phase 1 (in its QSPI, built by nixos-fpga)
# configures the HPS, and this core is phase 2, which the SDM takes only with
# phase 1's HPS IO hash. phase1 names it: its HPS shell lines and that hash
# come from agilex5-re's phase1 package.
phase1 = "de25-nano"

# Terasic DE25-Nano: CLOCK1_50 on V16 (bank 3.3 V); the interrupts end at
# the HPS.
[pins]
CLOCK1_50 = { pin = "V16", vccio = "3.3 V" }
irq0 = "f2h_irq0[0]"
irq3 = "f2h_irq0[3]"
