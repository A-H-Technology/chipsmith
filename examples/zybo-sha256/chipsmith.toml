# sha256 (examples/sha256's sources) on the Zybo's part: a synthesis,
# placement and routing bench, not for hardware. The DE2's ports land on
# arbitrary balls; SW, KEY, LEDR and LEDG don't exist on a Zybo. With no
# [clocks], the timing report times the clock against 12 MHz and reports
# the Fmax reached.
[project]
name = "sha256"
top = "top"
sources = ["../sha256/src/*.v"]

[target]
device = "xc7z010clg400-1"

[pins]
CLOCK_50 = "L16"
KEY = ["R18", "P16", "V16", "Y16"]
SW = [
    "K14", "K16", "K17", "K18", "K19", "L14", "L15", "L17", "L19",
    "L20", "M17", "M18", "M19", "M20", "N15", "N16", "N17", "N18",
]
LEDR = [
    "A20", "B19", "B20", "C20", "D18", "D19", "D20", "E17", "E18",
    "E19", "F16", "F17", "F19", "F20", "G14", "G15", "G17", "G18",
]
LEDG = ["G19", "G20", "H15", "H16", "H17", "H18", "H20", "J14", "J15"]
