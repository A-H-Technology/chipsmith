# cyclone2-re's examples/bidir: tri-state, bidirectional and open-drain pins.
[project]
name = "bidir"
top = "top"
sources = ["src/*.v"]

[target]
device = "EP2C35F672C6"

# Terasic DE2 user manual: tables 4.1 (switches, keys), 4.3 and 4.6 (LEDs),
# 4.10 (expansion header GPIO_0), 4.15 (SRAM data). The same pins as
# cyclone2-re's examples/bidir/pins.qsf.
[pins]
CLOCK_50 = "PIN_N2"
SW = [
    "PIN_N25", "PIN_N26", "PIN_P25", "PIN_AE14", "PIN_AF14", "PIN_AD13",
    "PIN_AC13", "PIN_C13", "PIN_B13", "PIN_A13", "PIN_N1", "PIN_P1",
    "PIN_P2", "PIN_T7", "PIN_U3", "PIN_U4", "PIN_V1", "PIN_V2",
]
KEY = ["PIN_G26", "PIN_N23", "PIN_P23", "PIN_W26"]
LEDR = [
    "PIN_AE23", "PIN_AF23", "PIN_AB21", "PIN_AC22", "PIN_AD22", "PIN_AD23",
    "PIN_AD21", "PIN_AC21", "PIN_AA14",
]
LEDG = ["PIN_AE22", "PIN_AF22"]
GPIO_0 = ["PIN_D25", "PIN_J22", "PIN_E26", "PIN_E25", "PIN_F24"]
SRAM_DQ = ["PIN_AD8", "PIN_AE6", "PIN_AF6", "PIN_AA9"]

# The DE2's 50 MHz oscillator; slack is reported against it.
[clocks]
CLOCK_50 = "50 MHz"
