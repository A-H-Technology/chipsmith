# Falling-edge registers checked on the board: a half-cycle path through a
# falling-edge register, and one with an enable, read back over JTAG.
[project]
name = "negedge-selftest"
top = "top"
sources = ["src/*.v"]

[target]
device = "EP2C35F672C6"

# Terasic DE2 user manual, table 4.3
[pins]
CLOCK_50 = "PIN_N2"
LEDR = "PIN_AE23"

[clocks]
CLOCK_50 = "50 MHz"
