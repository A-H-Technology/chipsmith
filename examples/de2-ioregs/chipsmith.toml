# I/O-cell registers with the cell's own controls: clock enables,
# active-low asynchronous clears and a preset (KEY[0], KEY[3]), falling-edge
# clocks,
# an input register with an enable and a clear, and a bidir whose three
# registers share one reset, all as Quartus packs them (cyclone2-re
# README, "I/O-cell register controls"). Safe to load with nothing plugged
# into the GPIO_0 header: GPIO_0[4] is driven only while KEY[2] is held.
# KEY[0] also resets the core registers, `negedge rst_n` as Terasic writes
# it (the LAB's clear-line inversion).
[project]
name = "de2_ioregs"
top = "top"
sources = ["src/*.v"]

[target]
device = "EP2C35F672C6"

# Pins: the Terasic DE2 user manual's tables.
[pins]
CLOCK_50 = "PIN_N2"
KEY = ["PIN_G26", "PIN_N23", "PIN_P23", "PIN_W26"]
SW = ["PIN_N25", "PIN_N26", "PIN_P25"]
SW_IN = { pins = ["PIN_T7", "PIN_U3", "PIN_U4", "PIN_V1"], registers = ["input"] }
LEDR = { pins = ["PIN_AE23", "PIN_AF23", "PIN_AB21", "PIN_AC22", "PIN_AD22", "PIN_AD23", "PIN_AD21", "PIN_AC21", "PIN_AA14", "PIN_Y13"], registers = ["output"] }
LEDG = ["PIN_AE22", "PIN_AF22", "PIN_W19", "PIN_V18", "PIN_U18"]
GPIO_IO = { pin = "PIN_F24", pull = "up", registers = ["input", "output", "output-enable"] }

# The DE2's 50 MHz oscillator; slack is reported against it.
[clocks]
CLOCK_50 = "50 MHz"
