# PicoRV32 running a self-checking program out of block RAM, the passes and
# the errors read back over JTAG in USER1.
[project]
name = "riscv-bram"
top = "top"
sources = ["src/*.v", "../picorv32/src/picorv32.v"]

[target]
device = "xc7z010clg400-1"

# Original Zybo (now "Zybo (legacy)"), Digilent Zybo-Master.xdc.
[pins]
clk = "L16"
led = ["M14", "M15", "G14", "D18"]

# The Zybo's 125 MHz clock on L16.
[clocks]
clk = "125 MHz"
