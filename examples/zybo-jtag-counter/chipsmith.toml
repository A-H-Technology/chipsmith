[project]
name = "jtag_counter"
top = "jtag_counter"
sources = ["src/*.v"]

[target]
device = "xc7z010clg400-1"

# Original Zybo (now "Zybo (legacy)"), Digilent Zybo-Master.xdc. The Zybo Z7's
# clock is on K17 instead.
[pins]
clk = "L16"
led = ["M14", "M15", "G14", "D18"]

# The Zybo's 125 MHz clock on L16.
[clocks]
clk = "125 MHz"
