[project]
name = "blinky"
top = "blinky"

[toolchain]
quartus-prime = "23.1"

[target]
family = "Cyclone V"
device = "5CSEBA6U23I7"
io_standard = "3.3-V LVTTL"

[hdl]
standard = "VHDL_2008"
sources = ["src/*.vhd"]

[pins]
clk = "PIN_V11"
led = ["PIN_W15", "PIN_AA24", "PIN_V16", "PIN_V15"]

[clocks]
clk = "50 MHz"

[sim]
# The simulator Quartus brings with it: Questa for Quartus Prime, ModelSim for
# Quartus II. Swap for "ghdl" (or pass --simulator ghdl) to test without one.
simulator = "quartus"
sources = ["tb/*.vhd"]
testbenches = ["blinky_tb"]
