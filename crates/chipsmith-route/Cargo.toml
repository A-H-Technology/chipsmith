[package]
name = "chipsmith-route"
description = "The routing graph, PathFinder router and timing graph chipsmith's device back ends share"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
lzma-rust2.workspace = true
postcard.workspace = true
rayon.workspace = true
# The router's batches on a GPU (`gpu` feature, ADR-0012).
cubecl = { version = "=0.11.3", default-features = false, features = ["std", "stdlib", "hip", "cuda"], optional = true }
serde.workspace = true

[features]
gpu = ["dep:cubecl"]
