[package]
name = "chipsmith-quartus-common"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The Quartus toolchain implementation for chipsmith: install, build, constraints, timing"

[dependencies]
async-trait = "0.1"
facet-json = "0.46"
chipsmith-sim = { path = "../chipsmith-sim", version = "0.2.0" }
chipsmith-toolchain = { path = "../chipsmith-toolchain", version = "0.2.0" }
dirs = "6"
futures-util = "0.3"
# rustls rather than the default native-tls: an openssl-linked binary can't find
# libssl.so.3 outside a nix shell, which defeats the point of a NixOS-first tool
reqwest = { version = "0.12", default-features = false, features = [
    "stream",
    "rustls-tls",
    "charset",
    "http2",
] }
tokio = { version = "1", features = ["process", "fs", "io-util"] }

[dev-dependencies]
chipsmith-toolchain = { path = "../chipsmith-toolchain", version = "0.2.0", features = [
    "test-host",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
