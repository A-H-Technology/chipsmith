name: Release-plz

permissions:
  pull-requests: write
  contents: write

# Off: nothing in this workspace is published to crates.io yet. Turn it back
# on (restore the `push: branches: [main]` trigger and drop the job's `if`)
# once there is a decision to publish, and set `publish = false` on whatever
# shouldn't go out with it.
on:
  workflow_dispatch:

jobs:
  release-plz:
    name: Release-plz
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
