name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      # the USB-Blaster driver (crates/chipsmith-jtag) links libusb
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config
      # Unit tests only, as the nix package runs them: the open crates'
      # integration tests check against oracles (yosys, cyclone2-re's
      # databases, prjxray) that only the nix devshell provides.
      - run: cargo nextest run --workspace --lib --bins

  # The whole workspace, open and vendor crates alike, since 2026-11-12.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # the USB-Blaster driver (crates/chipsmith-jtag) links libusb
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
