name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  # The vendor-tool runner's crates (crates/vendor-*), which have always been
  # held to clippy and rustfmt here.
  VENDOR: >-
    -p chipsmith-vendor -p chipsmith-core -p chipsmith-toolchain
    -p chipsmith-sim -p chipsmith-quartus-common -p chipsmith-quartus-ii-13
    -p chipsmith-quartus-prime -p chipsmith-quartus-pro

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      # the USB-Blaster driver (crates/chipsmith-jtag) links libusb
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config
      # Unit tests only, as the nix package runs them: the open crates'
      # integration tests check against oracles (yosys, cyclone2-re's
      # databases, prjxray) that only the nix devshell provides.
      - run: cargo nextest run --workspace --lib --bins

  # Clippy and rustfmt cover the vendor crates only, until the open crates
  # are clean under both (32 clippy warnings and 349 rustfmt diffs at the
  # merge); then drop $VENDOR for --workspace / --all.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy $VENDOR --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check $VENDOR
