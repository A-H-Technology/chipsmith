[package]
name = "chipsmith"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "An open FPGA toolchain: HDL in, bitstream out, chip programmed"
repository = "https://github.com/A-H-Technology/chipsmith"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
rusb = "0.9"
rustc-hash = "2"
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "xz"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
